name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hh-parser-bot

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hh-parser-bot/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check bot tests

      - name: Tests + coverage
        run: pytest -q --cov=bot --cov-report=term-missing --cov-fail-under=65

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: hhbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d hhbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bot:bot@localhost:5432/hhbot
      BOT_TOKEN: 123456:CI-TOKEN
      HH_USER_AGENT: hh-parser-bot/1.0 (ci@example.com)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hh-parser-bot/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt

      - name: Apply migrations
        run: python -m bot.db.migrate upgrade

      - name: Verify schema and ORM against PostgreSQL
        run: |
          python - <<'PY'
          import asyncio

          from sqlalchemy import inspect

          from bot.config import get_settings
          from bot.db.database import create_engine, create_session_factory, init_db
          from bot.db.models import User

          EXPECTED = {
              "users",
              "subscriptions",
              "sent_vacancies",
              "favorite_vacancies",
              "blocked_employers",
              "currencies",
              "alembic_version",
          }

          async def main() -> None:
              settings = get_settings()
              engine = create_engine(settings)
              # Повторный init_db должен быть идемпотентным (upgrade -> no-op).
              await init_db(engine, settings)

              async with engine.connect() as connection:
                  tables = await connection.run_sync(
                      lambda conn: set(inspect(conn).get_table_names())
                  )
              missing = EXPECTED - tables
              assert not missing, f"missing tables: {missing}"

              factory = create_session_factory(engine)
              async with factory() as session:
                  session.add(User(telegram_id=1, username="ci"))
                  await session.commit()

              print("PostgreSQL schema OK:", sorted(tables))
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Downgrade to base
        run: python -m bot.db.migrate downgrade
